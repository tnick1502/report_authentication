services:
  backend:
    build: ./backend/
    command: bash -c 'poetry run uvicorn main:app --host 0.0.0.0'
    environment:
      - FILE_COUNT=10
      - FILE_SIZE=1024
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_NAME}
      - WORK_TYPE=${WORK_TYPE}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - SUPERUSER_NAME=${SUPERUSER_NAME}
      - SUPERUSER_PASSWORD=${SUPERUSER_PASSWORD}
      - AWS_URI=${AWS_URI}
      - AWS_ACCCESS_KEY=${AWS_ACCCESS_KEY}
      - AWS_SERVICE_NAME=${AWS_SERVICE_NAME}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_BUCKET=${AWS_BUCKET}
    ports:
      - 8555:8000
    restart: always
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

  frontend:
    build: ./frontend/
    environment:
      - REACT_APP_SERVER_IP=http://localhost:8555/
      - DISABLE_ESLINT_PLUGIN=true
    expose:
      - "3000"
    restart: unless-stopped
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

  server:
    restart: always
    build: ./server
    environment:
      - ACME_EMAIL=sheepdolly2023@gmail.com
      - ACME_DOMAINS=${ACME_DOMAINS:-georeport.ru}
      - ACME_CERT_NAME=${ACME_CERT_NAME:-georeport.ru}
      - ACME_CHECK_INTERVAL=${ACME_CHECK_INTERVAL:-43200}
      - ACME_STAGING=${ACME_STAGING:-false}
    volumes:
      - ./app:/certs
      - ./acme/letsencrypt:/etc/letsencrypt
      - ./acme/lib:/var/lib/letsencrypt
      - ./acme/log:/var/log/letsencrypt
      - ./acme/www:/var/www/certbot
      - ./server/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
      - "443:443"
